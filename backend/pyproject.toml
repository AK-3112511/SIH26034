[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metrologyai-backend"
version = "0.1.0"
description = "MetrologyAI Backend API and PCR 2011 Rule Engine"
authors = [{ name = "MetrologyAI Team" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13",
    "geoalchemy2>=0.14.3",
    "psycopg2-binary>=2.9.9",
    "shapely>=2.0.3",
    "pyjwt>=2.8",
    "bcrypt>=4.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.2",
    "reportlab>=4.0",
]
requires-python = ">=3.10"

[project.optional-dependencies]
ocr = ["paddlepaddle>=2.6,<3.0", "paddleocr>=2.7,<2.9"]
vlm = ["torch>=2.2", "transformers>=4.40", "einops>=0.7", "timm>=0.9"]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I"]
ignore = [
    "B008",   # Do not perform function call `Depends`/`File`/`Form` in argument defaults (FastAPI standard)
    "BLE001", # Do not catch blind exception: `Exception` (needed for resilient optional plugin loading)
    "RUF022", # __all__ sorting (we prefer logical grouped organization)
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "fastapi.File", "fastapi.Form", "fastapi.Security"]
