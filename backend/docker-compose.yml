version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: metrologyai_db
    restart: always
    environment:
      POSTGRES_DB: metrologyai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metrologyai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
